name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    # Decides whether `check` runs. The path filter lives here, not in a
    # workflow-level paths-ignore: a skipped workflow never reports `check`,
    # so a pull request it skips would wait on the required check forever.
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Paths nothing in the check command or the build reads, as an
          # extended regex: a pull request that touches only these skips
          # `check`. Never list this workflow; a change to it must run.
          # docs/spec.md stays out: tests/test_config.py reads it.
          SKIP: '^(docs/(decisions\.md|logo-(light|dark)\.svg|tui\.svg)$|AGENTS\.md$|CLAUDE\.md$|CHANGELOG\.md$|\.agents/repokit\.toml$|\.github/dependabot\.yml$|\.github/workflows/(formula|pr-title|release)\.yml$)'
        run: |
          if [ -z "$PR" ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both sides of a rename count, so moving code into docs/ still runs.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qvE "$SKIP" <<<"$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  check:
    # The job name is the required status check on the default branch, so
    # rename it only together with the branch protection.
    name: check
    needs: changes
    # A job skipped by its `if:` reports success, which lets a docs-only pull
    # request merge. Anything but an explicit `false` runs it, so a failed
    # `changes` job still runs the checks instead of skipping them.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the Python version from .python-version.
      # setup-uv publishes no moving major tag; Dependabot keeps this current.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: make check
