[project]
name = "jumble"
version = "0.1.0"
description = "Random string generator — CLI and Textual TUI"
readme = "README.md"
authors = [
    { name = "John Foland", email = "johnfoland@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
jumble = "jumble:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest]
asyncio_mode = "auto"
testpaths = ["tests"]
