[project]
name = "jumble-cli"
version = "0.1.1"
description = "Random string generator — CLI and Textual TUI"
readme = "README.md"
authors = [
    { name = "John Foland", email = "johnfoland@users.noreply.github.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
]

[project.urls]
Homepage = "https://github.com/chocs-cat/jumble"
Issues = "https://github.com/chocs-cat/jumble/issues"

[project.scripts]
jumble = "jumble:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The distribution is jumble-cli, the import package jumble (DEC-24).
[tool.hatch.build.targets.wheel]
packages = ["src/jumble"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# The character sets are full of look-alikes on purpose (docs/spec.md §2.1).
"src/jumble/generate.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_sets.py" = ["RUF001", "RUF002", "RUF003"]
